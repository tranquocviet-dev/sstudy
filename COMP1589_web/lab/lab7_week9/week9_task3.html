<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, inital-scale=1">
		<title>Hello World</title>
	</head>
	<body>
		<canvas id="sCanvas" width="800" height="800"></canvas>
		<script type="text/javascript">
			let randomColour;
			let xPos;
			let yPos;
			let i;
			let j;
			
			const c = document.getElementById("sCanvas");
			const ctx = c.getContext("2d");
			
			function drawCircle(size,x,y,colour){
				ctx.beginPath();
				ctx.arc(x,y,size,0,2*Math.PI*2);
				ctx.fillStyle = colour;
				ctx.fill();
			}
			
			yPos = 30;
			xPos = 30;
			for (i=0; i<9; i++){
				for (j=0; j<9; j++){
					randomColour = '#' + Math.random().toString(16).substring(2,8);
					drawCircle(15, xPos, yPos, randomColour);
					xPos += 50;
				}
				xPos -= 50*9;
				yPos += 50;
			}
		</script>
	</body>
</html>
